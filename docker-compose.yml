services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-learning}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD en .env}
      POSTGRES_DB: ${POSTGRES_DB:-learning}
      POSTGRES_TEST_DB: ${POSTGRES_TEST_DB:-learning_test}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-learning} -d ${POSTGRES_DB:-learning}"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      DATABASE_URL: postgresql://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-learning}?schema=public
      TEST_DATABASE_URL: postgresql://${POSTGRES_USER:-learning}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_TEST_DB:-learning_test}?schema=public
    # migrate deploy solo aplica migraciones pendientes; nunca borra datos.
    command: sh -c "npm run db:deploy && npm run dev"
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - ./apps/api/src:/repo/apps/api/src
      - ./apps/api/tests:/repo/apps/api/tests
      - ./prisma:/repo/prisma

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      - api
    environment:
      VITE_PROXY_TARGET: http://api:3000
    ports:
      - "${WEB_PORT:-5173}:5173"
    volumes:
      - ./apps/web/src:/repo/apps/web/src

volumes:
  pgdata:
